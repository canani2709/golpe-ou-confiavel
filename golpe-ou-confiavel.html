<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://www.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src https://firestore.googleapis.com; base-uri 'none'; form-action 'none'; object-src 'none'">

<title>Golpe ou Confiável?</title>

<style>
/* Layout: uma coluna estreita como um feed de celular; cabeçalho com placar, o post no centro, botões de voto fixos no rodapé. */
:root{
  --bg:#eef0f6; --surface:#ffffff; --ink:#191b2b; --muted:#5d6178; --line:#d8dbe7;
  --accent:#4338ca; --on-accent:#ffffff; --scam:#d6293f; --scam-soft:#fde7ea; --safe:#13865a; --safe-soft:#e2f5ec; --flag:#f2a516;
  --post-bg:#ffffff; --post-ink:#14161f; --post-muted:#6b6f80; --post-line:#e6e8ef;
  --display:"Bricolage Grotesque", "Arial Narrow", system-ui, sans-serif;
  --body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12131d; --surface:#1c1e2c; --ink:#eceef8; --muted:#a3a7bf; --line:#2e3145;
  --accent:#8b85ff; --on-accent:#12131d; --scam:#ff5a6e; --scam-soft:#3a1820; --safe:#3ccf8e; --safe-soft:#123026; --flag:#f5b53a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12131d; --surface:#1c1e2c; --ink:#eceef8; --muted:#a3a7bf; --line:#2e3145;
  --accent:#8b85ff; --on-accent:#12131d; --scam:#ff5a6e; --scam-soft:#3a1820; --safe:#3ccf8e; --safe-soft:#123026; --flag:#f5b53a; color-scheme:dark}

body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45}
.wrap{box-sizing:border-box;max-width:460px;margin:0 auto;padding-block:16px 24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}

header{display:flex;align-items:center;justify-content:space-between;gap:12px}
h1{font-family:var(--display);font-weight:800;font-size:1.55rem;line-height:1;margin:0;letter-spacing:-.02em;text-wrap:balance}
h1 span{color:var(--scam)}
.score{font-family:var(--display);font-weight:800;font-size:1.05rem;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-variant-numeric:tabular-nums;white-space:nowrap}
.progress{display:flex;gap:5px}
.progress i{flex:1;height:5px;border-radius:3px;background:var(--line)}
.progress i.ok{background:var(--safe)} .progress i.bad{background:var(--scam)} .progress i.now{background:var(--accent)}
.prompt{margin:0;color:var(--muted);font-size:.95rem}

/* ---- tela inicial ---- */
.intro{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:14px}
.eyebrow{margin:0;font-size:.74rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
.intro h2{font-family:var(--display);font-weight:800;font-size:1.7rem;line-height:1.05;margin:0;letter-spacing:-.01em;text-wrap:balance}
.intro p{margin:0}
.duo{display:flex;gap:8px;flex-wrap:wrap}
.duo span{font-family:var(--display);font-weight:800;font-size:.9rem;padding:6px 12px;border-radius:8px;border:2px solid}
.duo .g{color:var(--scam);background:var(--scam-soft)} .duo .c{color:var(--safe);background:var(--safe-soft)}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-weight:700;font-size:.9rem}
.field input{font:inherit;padding:12px 14px;border-radius:10px;border:2px solid var(--line);background:var(--bg);color:var(--ink)}
.field input:focus-visible{outline:none;border-color:var(--accent)}
.field small{color:var(--muted);font-size:.8rem}

/* ---- post (sempre claro, como no app real) ---- */
.post{background:var(--post-bg);color:var(--post-ink);border-radius:14px;overflow:hidden;border:1px solid var(--post-line);box-shadow:0 6px 24px rgba(20,22,40,.12);position:relative}
.p-head{display:flex;align-items:center;gap:10px;padding:10px 12px}
.avatar{width:36px;height:36px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:700;color:#fff;font-size:.9rem}
.who{min-width:0;flex:1}
.who b{display:flex;align-items:center;gap:4px;font-size:.92rem}
.who small{display:block;color:var(--post-muted);font-size:.78rem}
.verified{width:14px;height:14px;border-radius:50%;background:#3b82f6;display:inline-grid;place-items:center;color:#fff;font-size:9px;font-weight:800}
.dots{color:var(--post-muted);font-weight:700;letter-spacing:1px}
.media{aspect-ratio:1/1;max-width:100%;position:relative;display:flex;flex-direction:column;justify-content:flex-end;padding:18px;color:#fff;overflow:hidden}
.media .kind{position:absolute;top:12px;left:12px;font-size:.72rem;font-weight:700;background:rgba(0,0,0,.45);padding:4px 8px;border-radius:6px;letter-spacing:.04em;text-transform:uppercase}
.media h3{font-family:var(--display);font-weight:800;font-size:1.65rem;line-height:1.05;margin:0 0 6px;text-wrap:balance;text-shadow:0 2px 12px rgba(0,0,0,.35)}
.media p{margin:0;font-size:.95rem;font-weight:500;text-shadow:0 1px 8px rgba(0,0,0,.4)}
/* com arte: ela ocupa um quadro quadrado e o título vai numa faixa escura logo abaixo, para os marcadores continuarem com onde se apoiar */
.media.has-real{aspect-ratio:auto;padding:0;background:#14161f!important}
.media .frame{position:relative;aspect-ratio:1/1;overflow:hidden}
.media .real{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000}
.media.has-real > .sig, .media.has-real > p{background:#14161f;margin:0;padding:10px 14px 6px}
.media.has-real h3{font-size:1.35rem;margin:0;text-shadow:none}
.media.has-real > p{padding:4px 14px 12px;font-size:.88rem;text-shadow:none;opacity:.9}
/* artes desenhadas em HTML: quadro fixo de 1080px, escalado para a largura do post (--s, definido em fitArt) */
.art{position:absolute;left:0;top:0;width:1080px;height:1080px;overflow:hidden;color:#fff;font-family:Figtree,var(--body);font-size:16px;line-height:1.2;transform-origin:0 0;transform:scale(var(--s,.4))}
.art *{box-sizing:border-box}
.art .d{font-family:"Bricolage Grotesque",var(--display);font-weight:800;letter-spacing:-.02em;line-height:.95}
.art .abs{position:absolute}
.art .chip{display:inline-block;padding:14px 28px;border-radius:999px;font-weight:900;font-size:38px}
.watermark{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
.watermark span{transform:rotate(-24deg);font-family:var(--display);font-weight:800;font-size:1.05rem;letter-spacing:.14em;color:rgba(255,255,255,.28);border:2px solid rgba(255,255,255,.28);padding:6px 12px;border-radius:6px;white-space:nowrap}
.cta-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;border-bottom:1px solid var(--post-line);background:#f6f7fb}
.cta-bar .dom{font-size:.78rem;color:var(--post-muted);min-width:0}
.cta-bar .dom-t{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cta-bar .btn{flex:none;background:#2f5bea;color:#fff;font-weight:700;font-size:.85rem;padding:7px 12px;border-radius:8px}
.caption{padding:10px 12px 4px;font-size:.9rem}
.caption b{font-weight:700}
.comments{padding:2px 12px 12px;font-size:.8rem;color:var(--post-muted)}

/* marcadores de sinal: laranja nos golpes, verde nos confiáveis */
.sig{position:relative;border-radius:8px;transition:box-shadow .25s}
.marked{--mk:var(--flag);--mk-ink:#1b1300}
.marked.okd{--mk:var(--safe);--mk-ink:#fff}
.marked .sig.on{box-shadow:0 0 0 3px var(--mk)}
.sig .n{display:none}
.marked .sig.on > .n{display:grid;position:absolute;top:-9px;right:-6px;min-width:22px;height:22px;padding:0 5px;box-sizing:border-box;border-radius:11px;background:var(--mk);color:var(--mk-ink);font-weight:800;font-size:.75rem;place-items:center;z-index:2;box-shadow:0 1px 4px rgba(0,0,0,.3)}
/* elementos que encostam na borda do post (que corta o que sai dele): número vai para dentro */
.marked .media.sig.on > .n{top:44px;right:auto;left:12px}
.marked .media.has-real.sig.on > .n{top:12px;right:12px;left:auto}
.marked .media.has-real.sig.on{box-shadow:inset 0 0 0 3px var(--mk)}
.marked .caption.sig.on > .n, .marked .comments.sig.on > .n{right:8px}
.marked .media.has-real > .sig.on{box-shadow:inset 0 0 0 3px var(--mk)}
.marked .media.has-real > .sig.on > .n{right:8px}

/* ---- votos: fixos no rodapé para o celular não esconder os botões ---- */
.vote{position:sticky;bottom:0;z-index:5;display:grid;grid-template-columns:1fr 1fr;gap:10px;padding-block:14px calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(to bottom,transparent,var(--bg) 30%)}
.vote button{font:inherit;font-family:var(--display);font-weight:800;font-size:1.15rem;padding:15px 10px;border-radius:12px;border:2px solid transparent;cursor:pointer;transition:transform .12s}
.vote button:active{transform:scale(.97)}
.vote button:focus-visible,.next:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#bSafe{background:var(--safe-soft);color:var(--safe);border-color:var(--safe)}
#bScam{background:var(--scam-soft);color:var(--scam);border-color:var(--scam)}

/* ---- revelação ---- */
.reveal{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px;margin-top:14px}
.verdict{display:flex;align-items:center;gap:10px}
.stamp{font-family:var(--display);font-weight:800;font-size:.85rem;letter-spacing:.06em;text-transform:uppercase;padding:5px 10px;border-radius:6px}
.stamp.scam{background:var(--scam);color:#fff} .stamp.safe{background:var(--safe);color:#fff}
.verdict b{font-size:1rem}
.reveal h4{margin:0;font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.reveal ol{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.reveal li{display:grid;grid-template-columns:24px 1fr;gap:9px;align-items:start;font-size:.93rem}
.reveal li .n{width:22px;height:22px;border-radius:50%;background:var(--flag);color:#1b1300;font-weight:800;font-size:.75rem;display:grid;place-items:center}
.reveal li .n.g{background:var(--safe);color:#fff}
.reveal li .n.tip{background:var(--accent);color:var(--on-accent)}
.case{font-size:.88rem;color:var(--muted);border-top:1px solid var(--line);padding-top:10px;margin:0}
.case a{color:var(--accent);font-weight:600}
.next{font:inherit;font-weight:700;background:var(--accent);color:var(--on-accent);border:0;border-radius:10px;padding:13px;cursor:pointer;font-size:1rem}
.next.ghost{background:transparent;color:var(--accent);border:2px solid var(--accent)}

/* ---- final ---- */
.end{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:14px}
.result{display:flex;flex-direction:column;gap:2px;padding:16px;border-radius:12px;background:var(--bg);border:1px solid var(--line)}
.result .who-r{font-weight:700;color:var(--muted);font-size:.9rem}
.end .big{font-family:var(--display);font-weight:800;font-size:3rem;line-height:1;font-variant-numeric:tabular-nums}
.level{font-family:var(--display);font-weight:800;font-size:1.25rem;color:var(--accent)}
.missed{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px;font-size:.9rem}
.missed li{display:flex;justify-content:space-between;gap:10px;border-bottom:1px dashed var(--line);padding-bottom:6px}
.missed li span:last-child{color:var(--muted);white-space:nowrap}
.soon{margin:0;background:var(--accent);color:var(--on-accent);border-radius:12px;padding:14px 16px;font-weight:600}
.end h2{font-family:var(--display);font-size:1.3rem;margin:0}
.check{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:9px;counter-reset:c}
.check li{counter-increment:c;display:grid;grid-template-columns:28px 1fr;gap:10px;font-size:.95rem}
.check li::before{content:counter(c);width:26px;height:26px;border-radius:7px;background:var(--accent);color:var(--on-accent);font-weight:800;display:grid;place-items:center;font-size:.85rem}
.foot{font-size:.78rem;color:var(--muted);text-align:center;margin:0}

/* ---- resultado da sala no fim do jogo ---- */
.room{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.room > div{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0}
.room small{display:block;color:var(--muted);font-size:.78rem}
.room b{display:block;font-family:var(--display);font-weight:800;font-size:1.5rem;font-variant-numeric:tabular-nums}
.room b.sm{font-size:1.05rem}
.room .wide{grid-column:1/-1}

/* ---- tela do telão (#telao): QR à esquerda, placar à direita ---- */
body.tv .wrap{max-width:1280px}
.tv-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:36px;align-items:start;padding-block:12px}
@media (max-width:860px){.tv-grid{grid-template-columns:1fr}}
.tv-card{display:flex;flex-direction:column;align-items:center;text-align:center;gap:18px;padding-block:16px}
.tv-card h1{font-size:clamp(2.4rem,5.5vw,4.4rem)}
.tv-sub{margin:0;font-size:clamp(1.05rem,2vw,1.35rem);color:var(--muted);max-width:30ch;text-wrap:balance}
.qr{background:#fff;padding:18px;border-radius:20px;line-height:0}
.qr img{display:block;width:min(320px,62vw);height:auto}
.tv-url{margin:0;font-family:var(--display);font-weight:800;font-size:clamp(1rem,2.2vw,1.5rem);overflow-wrap:anywhere}
.tv-live{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px 24px;display:flex;flex-direction:column;gap:18px;min-width:0}
.tv-live h2{font-family:var(--display);font-weight:800;font-size:1.35rem;margin:0 0 8px}
.tv-count{margin:0;font-size:1.1rem;color:var(--muted)}
.tv-count b{font-family:var(--display);font-weight:800;font-size:1.7rem;color:var(--ink);font-variant-numeric:tabular-nums}
.tv-note{margin:-6px 0 10px;font-size:.85rem;color:var(--muted)}
.rank{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;counter-reset:r}
.rank li{counter-increment:r;display:grid;grid-template-columns:34px minmax(0,1fr) auto auto;gap:12px;align-items:baseline;font-size:1.15rem;padding:7px 0;border-bottom:1px solid var(--line)}
.rank li::before{content:counter(r) "º";font-family:var(--display);font-weight:800;color:var(--muted)}
.rank li:first-child::before{color:var(--accent)}
.rank li.empty{display:block;color:var(--muted);font-size:1rem;border:0}
.rank li.empty::before{content:none}
.rank .nm{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rank .st{font-size:.85rem;color:var(--muted);white-space:nowrap}
.rank .pt{font-family:var(--display);font-weight:800;font-variant-numeric:tabular-nums;min-width:3.2ch;text-align:right}
.bars{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.bars li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:baseline}
.bars li.empty{display:block;color:var(--muted)}
.bars .lb{font-weight:600;min-width:0}
.bars .lb small{color:var(--muted);font-weight:500;margin-left:4px}
.bars .vl{font-weight:700;font-variant-numeric:tabular-nums}
.bars .tr{grid-column:1/-1;height:10px;border-radius:2px;background:var(--bg);overflow:hidden}
.bars .fl{display:block;height:100%;background:var(--scam);border-radius:0 4px 4px 0}
.reset{align-self:flex-start;font:inherit;font-size:.85rem;background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:8px;padding:6px 10px;cursor:pointer}
.reset.armed{border-color:var(--scam);color:var(--scam);font-weight:700}
.reset:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <header>
    <h1>Golpe ou <span>Confiável?</span></h1>
    <div class="score" id="score" aria-live="polite">0 pts</div>
  </header>
  <div class="progress" id="progress"></div>
  <p class="prompt" id="prompt"></p>
  <main id="stage"></main>
  <p class="foot">Anúncios reconstituídos a partir de casos reais noticiados. Links, QR codes, chaves Pix e telefones foram removidos.</p>
</div>

<!-- integrity: o navegador só executa o script se o conteúdo for exatamente o esperado -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js" integrity="sha384-3zSEDfvllQohrq0PHL1fOXJuC/jSOO34H46t6UQfobFOmxE5BpjjaIJY5F2/bMnU" crossorigin="anonymous" referrerpolicy="no-referrer"></script>

<script>

const JOGO_URL = "https://canani2709.github.io/golpe-ou-confiavel/";

const FIREBASE = {
  apiKey: "AIzaSyANbzsvQM0E5zIUGRQBlTS2UAexQZ2W43o",
  authDomain: "abex-ed9c2.firebaseapp.com",
  projectId: "abex-ed9c2",
  storageBucket: "abex-ed9c2.firebasestorage.app",
  messagingSenderId: "1083213179431",

};

// Cada caso tem a arte desenhada em HTML/CSS/SVG num quadro de 1080×1080 (campo art), escalada para o post.
// Tudo inventado para o jogo (continua com a marca "reconstituição").
// Para usar um print de anúncio real no lugar da arte: src:"midia/arquivo.png", real:true, e a fonte em midia/FONTES.md.
// Sinais: flags (golpe) e ok (confiável) são [onde marcar no post, texto]. Onde marcar: page, media, title, dom, cta, caption, comments, ou null (só na lista).
// A ordem dos casos é sorteada para cada jogador.
const CASES = [
  {
    id:"bonus", golpe:true, page:"Bônus Brasil Oficial", sub:"Patrocinado", av:"#0f7b3f", ini:"BB",
    bg:"linear-gradient(160deg,#0c3b24,#0f7b3f 55%,#e2b007)", video:true,
    kind:"Vídeo · 0:42",
    title:"“Saquei R$ 4.800 na primeira semana”",
    sub2:"Ex-jogador famoso recomenda a plataforma",
    dom:"[link removido]", cta:"Jogar agora",
    caption:"A plataforma que o Fenômeno usa 🔥 Cadastro com bônus liberado SÓ HOJE.",
    comments:"Comentários desativados",
    flags:[
      ["media","O vídeo é deepfake: rosto e voz de um ex-jogador famoso gerados por IA."],
      ["title","Promessa de ganho rápido e alto. Nenhuma plataforma legítima garante lucro."],
      ["caption","Urgência artificial: “só hoje” serve para você não parar para pensar."],
      ["comments","Comentários desativados escondem as pessoas reclamando que perderam dinheiro."]
    ],
    caso:"A Meta processou golpistas por um vídeo falso do Ronaldo usado para promover cassino online. Os anúncios usavam “cloaking”: mostravam uma versão inocente para a revisão da plataforma e outra para o público.",

  </svg>
  <div class="abs" style="left:60px;top:530px;width:560px;background:#fff;color:#111;border-radius:36px;padding:40px 44px;box-shadow:0 30px 80px rgba(0,0,0,.5)">
    <div style="font-size:34px;font-weight:700;color:#555">TV 50" 4K</div>
    <div style="font-size:34px;font-weight:700;color:#888;text-decoration:line-through;margin-top:10px">de R$ 2.799</div>

  }
];

// ---------- estado do jogador (salvo no aparelho para sobreviver a recarregar ou bloquear a tela) ----------
const KEY = 'golpe-ou-confiavel-v3';
let S = null; // { gid, rodada, treino, inicio, name, order:[índices], i, pts, results:[bool] }

// ---------- placar compartilhado ----------
// jogos/<gid>: um documento por jogador. config/atual: { rodada } — o botão "Zerar placar" do telão troca a rodada.
let fdb = null, rodadaAtual = 'geral';
const aoMudarRodada = [];
try{
  if(window.firebase){
    firebase.initializeApp(FIREBASE);
    fdb = firebase.firestore();
    fdb.doc('config/atual').onSnapshot(d=>{
      rodadaAtual = (d.exists && d.data().rodada) || 'geral';
      aoMudarRodada.forEach(fn=>fn(rodadaAtual));
    }, ()=>{});
  }
}catch(e){ fdb = null; }

function salvarPlacar(){
  if(!fdb || !S || S.treino) return;
  const respostas = {};
  S.results.forEach((r,k)=>{ respostas[CASES[S.order[k]].id] = r; });
  fdb.collection('jogos').doc(S.gid).set({
    rodada:S.rodada, nome:S.name || '', pts:S.pts,
    acertos:S.results.filter(Boolean).length, respondidas:S.results.length, total:CASES.length,
    respostas, fim:S.results.length >= CASES.length, inicio:S.inicio,
    atualizado:firebase.firestore.FieldValue.serverTimestamp()
  }).catch(()=>{});
}
// Qualquer pessoa pode escrever no banco, então cada documento é tratado como não confiável:
// só os campos esperados passam, com o tipo forçado (números viram números, nome vira texto curto).
function num(v){ const x = Number(v); return Number.isFinite(x) ? Math.max(0, Math.min(x, 1e6)) : 0; }
function limpar(id, d){
  d = d || {};
  const respostas = {};
  if(d.respostas && typeof d.respostas === 'object')
    CASES.forEach(c=>{ if(typeof d.respostas[c.id] === 'boolean') respostas[c.id] = d.respostas[c.id]; });
  return {
    id, nome: typeof d.nome === 'string' ? d.nome.slice(0,24) : '',
    pts: num(d.pts), acertos: num(d.acertos), respondidas: num(d.respondidas), total: num(d.total) || CASES.length,
    fim: d.fim === true, inicio: num(d.inicio), respostas
  };
}
function ouvirSala(rodada, fn){
  if(!fdb) return ()=>{};
  return fdb.collection('jogos').where('rodada','==',rodada)
    .onSnapshot(q=>fn(q.docs.map(d=>limpar(d.id, d.data()))), ()=>{});
}
function resumoSala(jogos){
  const rank = jogos.slice().sort((a,b)=> (b.pts-a.pts) || ((b.fim?1:0)-(a.fim?1:0)) || ((a.inicio||0)-(b.inicio||0)));
  const porCaso = CASES.map(c=>{
    let n=0, err=0;
    jogos.forEach(j=>{ const r = j.respostas && j.respostas[c.id]; if(r!==undefined){ n++; if(!r) err++; } });
    return {c, n, err, pct: n ? err/n : 0};
  }).filter(x=>x.n>0).sort((a,b)=> b.pct-a.pct || b.n-a.n);
  const fim = jogos.filter(j=>j.fim);
  const media = fim.length ? fim.reduce((s,j)=>s+j.acertos,0)/fim.length : null;
  return {rank, porCaso, media, nFim:fim.length};
}
function pct(x){ return Math.round(x*100) + '%'; }

const stage = document.getElementById('stage');
const prog = document.getElementById('progress');
const scoreEl = document.getElementById('score');
const promptEl = document.getElementById('prompt');

function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
function load(){
  try{
    const s = JSON.parse(localStorage.getItem(KEY));
    if(s && Array.isArray(s.order) && s.order.length===CASES.length && Array.isArray(s.results)) return s;
  }catch(e){}
  return null;
}
function shuffle(n){
  const a = [...Array(n).keys()];
  for(let k=n-1;k>0;k--){ const j=Math.floor(Math.random()*(k+1)); [a[k],a[j]]=[a[j],a[k]]; }
  return a;
}
function newGame(name, treino){
  S = { gid: Date.now().toString(36) + Math.random().toString(36).slice(2,8), rodada: rodadaAtual, treino: !!treino,
        inicio: Date.now(), name, order:shuffle(CASES.length), i:0, pts:0, results:[] };
  save(); salvarPlacar();
}
function cur(){ return CASES[S.order[S.i]]; }

function drawProgress(){
  const n = CASES.length, done = S ? S.results.length : 0;
  prog.innerHTML = CASES.map((_,k)=>{
    const c = k<done ? (S.results[k]?'ok':'bad') : (S && k===S.i ? 'now' : '');
    return `<i class="${c}"></i>`;
  }).join('');
  scoreEl.textContent = (S ? S.pts : 0) + ' pts';
}

// escala as artes de 1080px para a largura atual do quadro
function fitArt(){
  document.querySelectorAll('.media .frame').forEach(f=>f.style.setProperty('--s', f.clientWidth/1080));
}
window.addEventListener('resize', fitArt);

function mediaEl(src){
  return /\.(mp4|webm|mov)$/i.test(src)
    ? `<video class="real" src="${esc(src)}" controls playsinline preload="metadata"></video>`
    : `<img class="real" src="${esc(src)}" alt="Print do anúncio original">`;
}

// ---------- telas ----------
function intro(){
  drawProgress();
  promptEl.hidden = true;
  stage.innerHTML = `
  <section class="intro">
    <p class="eyebrow">Mini jogo · uns 5 minutos</p>
    <h2>Você cairia nesses anúncios?</h2>
    <p>São ${CASES.length} anúncios montados a partir de casos reais. Alguns são golpe, outros são de verdade. Em cada um, decida:</p>
    <div class="duo"><span class="c">Confiável</span><span class="g">Golpe</span></div>
    <p>Depois de cada resposta, mostramos os sinais que entregam o anúncio. Cada acerto vale 100 pontos.</p>
    <div class="field">
      <label for="nick">Seu apelido</label>
      <input id="nick" maxlength="24" autocomplete="off" placeholder="Ex.: Ana da 3ª fileira">
      <small>Aparece no placar projetado para a turma. Use um apelido, não o nome completo.</small>
    </div>
    <button class="next" id="go" type="button">Começar</button>
  </section>`;
  const nick = document.getElementById('nick');
  const go = ()=>{ newGame(nick.value.trim().slice(0,24)); promptEl.hidden=false; render(); window.scrollTo({top:0}); };
  document.getElementById('go').onclick = go;
  nick.addEventListener('keydown', e=>{ if(e.key==='Enter') go(); });
}

function post(c){
  const art = c.art || '';
  const src = art ? '' : (c.src || '');
  const real = !!c.real;
  const has = art || src;
  return `
  <article class="post" id="post">
    <div class="p-head">
      <div class="avatar sig" data-k="page" style="background:${c.av}">${esc(c.ini)}<span class="n"></span></div>
      <div class="who"><b>${esc(c.page)} ${c.verified?'<span class="verified">✓</span>':''}</b><small>${esc(c.sub)}</small></div>
      <span class="dots">···</span>
    </div>
    <div class="media sig${has?' has-real':''}" data-k="media" style="background:${c.bg}">
      ${has?`<div class="frame">${art || mediaEl(src)}
        ${real?'':'<div class="watermark" aria-hidden="true"><span>RECONSTITUIÇÃO</span></div>'}</div>`:`
      <div class="watermark" aria-hidden="true"><span>RECONSTITUIÇÃO</span></div>`}
      <span class="kind">${esc(real?'Anúncio real':c.kind)}</span>
      <div class="sig" data-k="title"><h3>${esc(c.title)}</h3><span class="n"></span></div>
      <p>${esc(c.sub2)}</p>
      <span class="n"></span>
    </div>
    <div class="cta-bar">
      <span class="dom sig" data-k="dom"><span class="dom-t">${esc(c.dom)}</span><span class="n"></span></span>
      <span class="btn sig" data-k="cta">${esc(c.cta)}<span class="n"></span></span>
    </div>
    <div class="caption sig" data-k="caption"><b>${esc(c.page)}</b> ${esc(c.caption)}<span class="n"></span></div>
    <div class="comments sig" data-k="comments">${esc(c.comments)}<span class="n"></span></div>
  </article>`;
}

function render(){
  const c = cur();
  drawProgress();
  promptEl.hidden = false;
  promptEl.textContent = `Anúncio ${S.i+1} de ${CASES.length}. Apareceu no seu feed. Você clicaria?`;
  stage.innerHTML = post(c) + `
    <div class="vote" id="vote">
      <button id="bSafe" type="button">Confiável</button>
      <button id="bScam" type="button">Golpe</button>
    </div>`;
  fitArt();
  document.getElementById('bSafe').onclick = ()=>answer(false);
  document.getElementById('bScam').onclick = ()=>answer(true);
}

function answer(saidScam){
  const c = cur();
  const right = saidScam === c.golpe;
  S.results.push(right);
  if(right) S.pts += 100;
  save(); salvarPlacar();
  drawProgress();
  document.getElementById('vote').remove();

  // marca no post os elementos citados; um elemento pode ter mais de um sinal ("1·2")
  const postEl = document.getElementById('post');
  const items = c.golpe ? c.flags : c.ok;
  postEl.classList.add('marked');
  if(!c.golpe) postEl.classList.add('okd');
  const nums = {};
  items.forEach(([k],n)=>{ if(k) (nums[k] = nums[k] || []).push(n+1); });
  Object.entries(nums).forEach(([k,ns])=>{
    const el = postEl.querySelector(`.sig[data-k="${k}"]`);
    if(el){ el.classList.add('on'); el.querySelector(':scope > .n').textContent = ns.join('·'); }
  });
  const list = items.map(([k,t],n)=> k
    ? `<li><span class="n${c.golpe?'':' g'}">${n+1}</span><span>${esc(t)}</span></li>`
    : `<li><span class="n tip">i</span><span>${esc(t)}</span></li>`).join('');

  const last = S.i >= CASES.length-1;
  const box = document.createElement('section');
  box.className = 'reveal';
  box.innerHTML = `
    <div class="verdict">
      <span class="stamp ${c.golpe?'scam':'safe'}">${c.golpe?'Golpe':'Confiável'}</span>
      <b>${right?'Você acertou! +100':'Não foi dessa vez.'}</b>
    </div>
    <h4>${c.golpe?'Os sinais que denunciavam':'Por que é confiável'}</h4>
    <ol>${list}</ol>
    <p class="case"><b>${c.url?'Caso real:':'Sobre este anúncio:'}</b> ${esc(c.caso)} ${c.url?`<br>Fonte: <a href="${c.url}" target="_blank" rel="noopener">${esc(c.fonte)}</a>`:''}</p>
    <button class="next" id="next" type="button">${last?'Ver meu resultado':'Próximo anúncio'}</button>`;
  stage.appendChild(box);
  document.getElementById('next').onclick = ()=>{
    S.i++; save();
    S.i < CASES.length ? render() : finish();
    window.scrollTo({top:0,behavior:'smooth'});
  };
  box.scrollIntoView({behavior:'smooth',block:'nearest'});
}

function level(ok, n){
  if(ok===n) return 'Olho de águia';
  if(ok>=n-2) return 'Desconfiado na medida certa';
  if(ok>=Math.ceil(n/2)) return 'Quase lá';
  return 'Alvo fácil (por enquanto)';
}

function finish(){
  S.i = CASES.length; save();
  drawProgress();
  const n = CASES.length;
  const ok = S.results.filter(Boolean).length;
  const missed = S.results.map((r,k)=>r?null:CASES[S.order[k]]).filter(Boolean);
  promptEl.textContent = 'Fim de jogo.';
  stage.innerHTML = `
  <section class="end">
    <div class="result">
      ${S.name?`<span class="who-r">${esc(S.name)}</span>`:''}
      <div class="big">${ok}/${n}</div>
      <span class="level">${level(ok,n)}</span>
      <span class="prompt">${S.pts} pontos</span>
    </div>
    ${S.treino?'<p class="prompt">Rodada de treino: este resultado não entra no placar da sala.</p>':''}
    ${fdb?'<div class="room" id="room"><div class="wide"><small>Carregando os resultados da sala…</small></div></div>':''}
    ${missed.length?`<div><h2 style="margin-bottom:8px">Onde você caiu</h2><ul class="missed">${missed.map(c=>`<li><span>${esc(c.page)}</span><span>era ${c.golpe?'golpe':'confiável'}</span></li>`).join('')}</ul></div>`:''}
    <p class="soon">A apresentação já vai começar. Guarde esta tela: vamos perguntar quem acertou tudo e em qual anúncio a sala mais caiu.</p>
    <h2>Antes de clicar em qualquer anúncio</h2>
    <ul class="check">
      <li>O preço ou prêmio é bom demais para ser verdade?</li>
      <li>Tem pressa? “Só hoje”, “últimas vagas”, contador.</li>
      <li>É o perfil oficial da marca, do artista ou do órgão?</li>
      <li>O link leva ao site oficial? Na dúvida, digite o endereço você mesmo.</li>
      <li>Famoso recomendando bet, investimento ou promoção? Pode ser deepfake.</li>
    </ul>
    <p class="prompt">Anúncio pago não é selo de verificação. A rede social não confere se a oferta é verdadeira.</p>
    <button class="next ghost" id="again" type="button">Jogar de novo</button>
  </section>`;
  // resultado da sala ao vivo: posição, média e o anúncio em que mais gente caiu
  if(stopSala) stopSala();
  const meu = S.gid, treino = S.treino;
  stopSala = ouvirSala(S.rodada, jogos=>{
    const box = document.getElementById('room');
    if(!box) return;
    const r = resumoSala(jogos);
    const pos = r.rank.findIndex(j=>j.id===meu) + 1;
    const pior = r.porCaso[0];
    box.innerHTML = `
      ${!treino && pos ? `<div><small>Sua posição</small><b>${pos}º de ${r.rank.length}</b></div>` : `<div><small>Jogadores na sala</small><b>${r.rank.length}</b></div>`}
      <div><small>Média da sala</small><b>${r.media===null?'–':r.media.toFixed(1).replace('.',',')+'/'+n}</b></div>
      ${pior && pior.err ? `<div class="wide"><small>Onde a sala mais caiu</small><b class="sm">${esc(pior.c.page)} · ${pct(pior.pct)} erraram</b></div>` : ''}`;
  });
  document.getElementById('again').onclick = ()=>{ if(stopSala){ stopSala(); stopSala=null; } newGame(S.name, true); render(); window.scrollTo({top:0}); };
}
let stopSala = null;

// tela para projetar antes da apresentação: QR code + placar ao vivo
function telao(){
  document.body.classList.add('tv');
  const url = JOGO_URL || location.href.split('#')[0];
  document.querySelector('.wrap').innerHTML = `
  <div class="tv-grid">
    <section class="tv-card">
      <h1>Golpe ou <span>Confiável?</span></h1>
      <p class="tv-sub">Enquanto a apresentação não começa, aponte a câmera do celular e jogue.</p>
      <div class="qr" id="qr"></div>
      <p class="tv-url">${esc(url.replace(/^https?:\/\//,'').replace(/\/$/,''))}</p>
      <p class="tv-sub">${CASES.length} anúncios · uns 5 minutos · tem golpe e tem anúncio de verdade</p>
    </section>
    ${fdb?`<section class="tv-live">
      <p class="tv-count"><b id="nJog">0</b> jogando <span aria-hidden="true">·</span> <b id="nFim">0</b> terminaram <span aria-hidden="true">·</span> média <b id="media">–</b></p>
      <div><h2>Ranking ao vivo</h2><ol class="rank" id="rank"></ol></div>
      <div><h2>Onde a sala mais caiu</h2><p class="tv-note">Porcentagem de quem errou cada anúncio</p><ul class="bars" id="bars"></ul></div>
      <button class="reset" id="reset" type="button">Zerar placar</button>
    </section>`:''}
  </div>`;
  const box = document.getElementById('qr');
  if(window.QRCode){
    new QRCode(box, {text:url, width:720, height:720, colorDark:'#191b2b', colorLight:'#ffffff', correctLevel:QRCode.CorrectLevel.M});
  } else box.hidden = true;
  if(!fdb) return;

  const desenhar = jogos=>{
    const r = resumoSala(jogos);
    document.getElementById('nJog').textContent = r.rank.length - r.nFim;
    document.getElementById('nFim').textContent = r.nFim;
    document.getElementById('media').textContent = r.media===null ? '–' : r.media.toFixed(1).replace('.',',') + '/' + CASES.length;
    document.getElementById('rank').innerHTML = r.rank.length
      ? r.rank.slice(0,8).map(j=>`<li><span class="nm">${esc(j.nome || 'Anônimo')}</span><span class="st">${esc(j.fim ? j.acertos+'/'+j.total : 'jogando · '+j.respondidas+'/'+j.total)}</span><span class="pt">${esc(j.pts)}</span></li>`).join('')
      : '<li class="empty">Ninguém jogou ainda. Escaneie o QR code e seja o primeiro.</li>';
    document.getElementById('bars').innerHTML = r.porCaso.length
      ? r.porCaso.map(x=>`<li title="${x.err} de ${x.n} erraram">
          <span class="lb">${esc(x.c.page)} <small>era ${x.c.golpe?'golpe':'confiável'}</small></span>
          <span class="vl">${pct(x.pct)}</span>
          <span class="tr"><span class="fl" style="width:${Math.max(x.pct*100,0.5)}%"></span></span></li>`).join('')
      : '<li class="empty">As respostas aparecem aqui assim que a primeira pessoa votar.</li>';
  };
  let stop = ouvirSala(rodadaAtual, desenhar);
  aoMudarRodada.push(rod=>{ stop(); stop = ouvirSala(rod, desenhar); });

  // zerar: começa uma rodada nova (os jogos antigos continuam no banco, só saem do telão)
  const reset = document.getElementById('reset');
  let armado = null;
  reset.onclick = ()=>{
    if(!armado){
      reset.textContent = 'Clique de novo para zerar';
      reset.classList.add('armed');
      armado = setTimeout(()=>{ armado=null; reset.textContent='Zerar placar'; reset.classList.remove('armed'); }, 4000);
      return;
    }
    clearTimeout(armado); armado = null;
    reset.textContent = 'Zerar placar'; reset.classList.remove('armed');
    fdb.doc('config/atual').set({rodada:'r'+Date.now()}).catch(()=>{ reset.textContent = 'Não foi possível zerar. Confira a internet.'; });
  };
}

// ---------- início ----------
if(location.hash === '#telao'){
  telao();
} else {
  S = load();
  if(!S) intro();
  else if(S.results.length >= CASES.length) finish();
  else { S.i = S.results.length; render(); }
}
</script>
